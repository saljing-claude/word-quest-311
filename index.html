<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英語單字大冒險 🪙 Word Quest 311</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 16px; }
    header { width: 100%; max-width: 600px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding: 16px; background: #1e293b; border-radius: 16px; }
    h1 { font-size: 1.5rem; color: #facc15; }
    .coin-badge { background: rgba(234, 179, 8, 0.2); padding: 8px 16px; border-radius: 12px; font-size: 1.25rem; font-weight: bold; color: #fde047; }
    main { width: 100%; max-width: 600px; flex: 1; display: flex; flex-direction: column; justify-content: center; }
    .card { background: #1e293b; padding: 24px; border-radius: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .hidden { display: none !important; }
    .form-group { margin: 16px 0; }
    label { display: block; font-size: 0.875rem; color: #94a3b8; margin-bottom: 6px; }
    input[type="text"] { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 12px 16px; color: #fff; font-size: 1rem; outline: none; }
    .btn-primary { width: 100%; background: #9333ea; color: white; font-weight: bold; padding: 14px; border: none; border-radius: 12px; font-size: 1rem; cursor: pointer; }
    .level-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; margin-top: 16px; }
    .level-card { background: #0f172a; border: 1px solid #a855f7; padding: 16px; border-radius: 16px; text-align: center; cursor: pointer; }
    .target-box { text-align: center; padding: 24px; background: #0f172a; border-radius: 16px; margin: 20px 0; }
    .target-word { font-size: 2.25rem; font-weight: bold; color: #fde047; }
    .options-grid { display: flex; flex-direction: column; gap: 12px; }
    .option-btn { width: 100%; background: #334155; border: 1px solid #475569; color: white; font-size: 1.125rem; padding: 14px; border-radius: 12px; font-weight: bold; cursor: pointer; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>WORD QUEST 311</h1>
      <p id="user-display" style="font-size: 0.75rem; color: #94a3b8;">請先登入開始闖關</p>
    </div>
    <div class="coin-badge">🪙 <span id="coin-count">0</span></div>
  </header>

  <main>
    <section id="view-login" class="card">
      <h2 style="text-align: center; color: #d8b4fe;">🎮 冒險者登入</h2>
      <div class="form-group">
        <label>班級 / 座號 / 姓名</label>
        <input type="text" id="input-name" placeholder="例如：五年一班 05 號 張小明">
      </div>
      <button type="button" id="start-btn" class="btn-primary">開始挑戰 🚀</button>
    </section>

    <section id="view-levels" class="hidden">
      <div class="top-bar">
        <h2 style="color: #d8b4fe;">📍 選擇關卡</h2>
      </div>
      <div id="level-grid" class="level-grid"></div>
    </section>

    <section id="view-game" class="card hidden">
      <div class="top-bar" style="color: #94a3b8; font-size: 0.875rem;">
        <span id="game-progress">進度：1 / 10</span>
        <button onclick="backToLevels()" style="background:none; border:none; color:#94a3b8; cursor:pointer;">✕ 退出</button>
      </div>
      <div class="target-box">
        <div id="target-word" class="target-word">bad</div>
      </div>
      <div id="options-container" class="options-grid"></div>
    </section>
  </main>

  <script>
    const wordBank = [
      { word: "bad", chinese: "壞的" }, { word: "mad", chinese: "生氣的" },
      { word: "sad", chinese: "難過的" }, { word: "fan", chinese: "電扇" },
      { word: "man", chinese: "男人" }, { word: "ham", chinese: "火腿" },
      { word: "bat", chinese: "球棒" }, { word: "cat", chinese: "貓" },
      { word: "fat", chinese: "胖的" }, { word: "hat", chinese: "帽子" }
    ];

    let currentUser = "";
    let userCoins = 0;
    let currentQuestionIndex = 0;
    let levelWords = [];

    document.getElementById('start-btn').onclick = function() {
      const val = document.getElementById('input-name').value.trim();
      if (!val) {
        alert("請輸入姓名！");
        return;
      }
      currentUser = val;
      document.getElementById('user-display').innerText = "👤 冒險者：" + currentUser;
      document.getElementById('view-login').classList.add('hidden');
      document.getElementById('view-levels').classList.remove('hidden');
      renderLevels();
    };

    function renderLevels() {
      const grid = document.getElementById('level-grid');
      grid.innerHTML = "";
      const btn = document.createElement('div');
      btn.className = "level-card";
      btn.onclick = () => startLevel();
      btn.innerHTML = `<span style="font-weight:bold;">第 1 關</span><br><span style="font-size:0.75rem; color:#94a3b8;">10 個單字</span>`;
      grid.appendChild(btn);
    }

    function startLevel() {
      currentQuestionIndex = 0;
      levelWords = wordBank;
      document.getElementById('view-levels').classList.add('hidden');
      document.getElementById('view-game').classList.remove('hidden');
      loadQuestion();
    }

    function loadQuestion() {
      const currentWord = levelWords[currentQuestionIndex];
      document.getElementById('game-progress').innerText = `進度：${currentQuestionIndex + 1} / ${levelWords.length}`;
      document.getElementById('target-word').innerText = currentWord.word;

      const container = document.getElementById('options-container');
      container.innerHTML = "";

      let options = [currentWord.chinese];
      while (options.length < 3) {
        const r = wordBank[Math.floor(Math.random() * wordBank.length)].chinese;
        if (!options.includes(r)) options.push(r);
      }
      options.sort(() => Math.random() - 0.5);

      options.forEach(opt => {
        const b = document.createElement('button');
        b.className = "option-btn";
        b.innerText = opt;
        b.onclick = () => {
          if (opt === currentWord.chinese) {
            userCoins += 10;
            document.getElementById('coin-count').innerText = userCoins;
            currentQuestionIndex++;
            if (currentQuestionIndex < levelWords.length) {
              loadQuestion();
            } else {
              alert("🎉 恭喜通關！");
              backToLevels();
            }
          } else {
            alert("答錯囉，再試一次！");
          }
        };
        container.appendChild(b);
      });
    }

    function backToLevels() {
      document.getElementById('view-game').classList.add('hidden');
      document.getElementById('view-levels').classList.remove('hidden');
    }
  </script>
</body>
</html>
