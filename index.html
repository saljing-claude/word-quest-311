<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英語單字大冒險 🪙 Word Quest 311</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }
    header {
      width: 100%;
      max-width: 600px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 16px 0;
      padding: 16px;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid #334155;
      border-radius: 16px;
      backdrop-filter: blur(8px);
    }
    h1 {
      font-size: 1.5rem;
      color: #facc15;
      text-shadow: 0 0 12px rgba(251, 191, 36, 0.8);
      letter-spacing: 1px;
    }
    .user-info {
      font-size: 0.75rem;
      color: #94a3b8;
    }
    .coin-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(234, 179, 8, 0.2);
      padding: 8px 16px;
      border-radius: 12px;
      border: 1px solid rgba(234, 179, 8, 0.4);
      font-size: 1.25rem;
      font-weight: bold;
      color: #fde047;
    }
    main {
      width: 100%;
      max-width: 600px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .card {
      background: rgba(30, 41, 59, 0.9);
      padding: 24px;
      border-radius: 24px;
      border: 1px solid rgba(168, 85, 247, 0.3);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .hidden {
      display: none !important;
    }
    .form-group {
      margin-top: 16px;
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 0.875rem;
      color: #94a3b8;
      margin-bottom: 6px;
    }
    input[type="text"] {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 12px 16px;
      color: #ffffff;
      font-size: 1rem;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: #a855f7;
    }
    .btn-primary {
      width: 100%;
      background: linear-gradient(90deg, #9333ea 0%, #db2777 100%);
      color: white;
      font-weight: bold;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-primary:hover {
      opacity: 0.9;
    }
    .level-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 16px;
      margin-top: 16px;
    }
    .level-card {
      background: #1e293b;
      border: 1px solid rgba(168, 85, 247, 0.4);
      padding: 16px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .level-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 25px -5px rgba(124, 58, 237, 0.5);
    }
    .level-subtitle {
      font-size: 0.75rem;
      color: #c084fc;
    }
    .level-title {
      font-size: 1.125rem;
      font-weight: bold;
    }
    .level-count {
      font-size: 0.75rem;
      color: #94a3b8;
    }
    .target-box {
      text-align: center;
      padding: 24px;
      background: rgba(15, 23, 42, 0.5);
      border-radius: 16px;
      border: 1px solid rgba(51, 65, 85, 0.5);
      margin: 20px 0;
    }
    .target-word {
      font-size: 2.25rem;
      font-weight: bold;
      color: #fde047;
      text-shadow: 0 0 12px rgba(251, 191, 36, 0.8);
      margin-top: 8px;
    }
    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .option-btn {
      width: 100%;
      background: rgba(51, 65, 85, 0.6);
      border: 1px solid #475569;
      color: white;
      font-size: 1.125rem;
      padding: 14px;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.15s;
    }
    .option-btn:hover {
      background: rgba(147, 51, 234, 0.5);
      border-color: #c084fc;
    }
    .option-btn.correct {
      background: #16a34a !important;
      border-color: #4ade80 !important;
    }
    .option-btn.wrong {
      background: #dc2626 !important;
      border-color: #f87171 !important;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .leaderboard-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.6);
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #334155;
      margin-bottom: 12px;
    }
    .rank-num {
      font-weight: bold;
      font-size: 1.125rem;
      margin-right: 12px;
    }
    .rank-1 { color: #facc15; }
    .rank-2 { color: #cbd5e1; }
    .rank-3 { color: #d97706; }
  </style>
</head>
<body>

  <!-- 頂部標題與個人狀態 -->
  <header>
    <div>
      <h1>WORD QUEST 311</h1>
      <p id="user-display" class="user-info">請先登入開始闖關</p>
    </div>
    <div class="coin-badge">
      <span>🪙</span>
      <span id="coin-count">0</span>
    </div>
  </header>

  <!-- 主要內容區域 -->
  <main>
    
    <!-- 1. 學生登入視窗 -->
    <section id="view-login" class="card">
      <h2 style="text-align: center; color: #d8b4fe;">🎮 冒險者登入</h2>
      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="input-name">班級 / 座號 / 姓名</label>
          <input type="text" id="input-name" placeholder="例如：五年一班 05 號 張小明" required autocomplete="off">
        </div>
        <button type="submit" class="btn-primary">開始挑戰 🚀</button>
      </form>
    </section>

    <!-- 2. 關卡選擇視窗 -->
    <section id="view-levels" class="hidden">
      <div class="top-bar">
        <h2 style="color: #d8b4fe;">📍 選擇本週關卡 (每關 10 字)</h2>
        <button onclick="showLeaderboard()" style="background: rgba(245, 158, 11, 0.2); color: #fde047; border: 1px solid rgba(245, 158, 11, 0.4); padding: 6px 12px; border-radius: 8px; cursor: pointer;">🏆 每日排行榜</button>
      </div>
      <div id="level-grid" class="level-grid"></div>
    </section>

    <!-- 3. 小遊戲答題視窗 -->
    <section id="view-game" class="card hidden">
      <div class="top-bar" style="color: #94a3b8; font-size: 0.875rem;">
        <span id="game-progress">進度：1 / 10</span>
        <button onclick="backToLevels()" style="background: none; border: none; color: #94a3b8; cursor: pointer;">✕ 放棄退出</button>
      </div>
      
      <div class="target-box">
        <span style="font-size: 0.75rem; color: #c084fc; text-transform: uppercase; letter-spacing: 2px;">Target Word</span>
        <div id="target-word" class="target-word">bad</div>
      </div>

      <div id="options-container" class="options-grid"></div>
    </section>

    <!-- 4. 每日排行榜視窗 -->
    <section id="view-leaderboard" class="card hidden">
      <div class="top-bar" style="margin-bottom: 16px;">
        <h2 style="color: #facc15;">🏆 今日金幣英雄榜</h2>
        <button onclick="backToLevels()" style="background: none; border: none; color: #94a3b8; cursor: pointer;">返回關卡</button>
      </div>
      <div id="leaderboard-list"></div>
    </section>

  </main>

  <script>
    const wordBank = [
      { word: "bad", chinese: "壞的" },
      { word: "mad", chinese: "生氣的" },
      { word: "sad", chinese: "難過的" },
      { word: "fan", chinese: "電扇" },
      { word: "man", chinese: "男人" },
      { word: "ham", chinese: "火腿" },
      { word: "bat", chinese: "球棒" },
      { word: "cat", chinese: "貓" },
      { word: "fat", chinese: "胖的" },
      { word: "hat", chinese: "帽子" },
      { word: "kid", chinese: "孩子" },
      { word: "lid", chinese: "蓋子" },
      { word: "dig", chinese: "挖洞" },
      { word: "pig", chinese: "豬" },
      { word: "fin", chinese: "魚鰭" },
      { word: "win", chinese: "獲勝" },
      { word: "kit", chinese: "工具箱" },
      { word: "hit", chinese: "打擊" },
      { word: "job", chinese: "職業" },
      { word: "mom", chinese: "媽媽" }
    ];

    let currentUser = "";
    let userCoins = 0;
    let currentLevel = 0;
    let currentQuestionIndex = 0;
    let levelWords = [];

    function handleLogin(event) {
      if (event) event.preventDefault();
      
      const inputEl = document.getElementById('input-name');
      const nameInput = inputEl ? inputEl.value.trim() : "";
      
      if (!nameInput) {
        alert("請輸入班級、座號與姓名！");
        return;
      }
      
      currentUser = nameInput;
      document.getElementById('user-display').innerText = `👤 冒險者：${currentUser}`;
      
      loadUserData();
      switchView('view-levels');
      renderLevels();
    }

    function loadUserData() {
      try {
        const data = JSON.parse(localStorage.getItem(`user_${currentUser}`)) || { coins: 0 };
        userCoins = data.coins || 0;
      } catch (e) {
        userCoins = 0;
      }
      updateCoinDisplay();
    }

    function addCoins(amount) {
      userCoins += amount;
      updateCoinDisplay();
      try {
        localStorage.setItem(`user_${currentUser}`, JSON.stringify({ coins: userCoins }));
        saveToLeaderboard();
      } catch (e) {}
    }

    function updateCoinDisplay() {
      document.getElementById('coin-count').innerText = userCoins;
    }

    function switchView(viewId) {
      ['view-login', 'view-levels', 'view-game', 'view-leaderboard'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.classList.add('hidden');
      });
      const target = document.getElementById(viewId);
      if (target) target.classList.remove('hidden');
    }

    function renderLevels() {
      const grid = document.getElementById('level-grid');
      if (!grid) return;
      grid.innerHTML = "";
      const totalLevels = Math.ceil(wordBank.length / 10);

      for (let i = 0; i < totalLevels; i++) {
        const btn = document.createElement('div');
        btn.className = "level-card";
        btn.onclick = () => startLevel(i);
        btn.innerHTML = `
          <span class="level-subtitle">WEEK ${i + 1}</span>
          <span class="level-title">第 ${i + 1} 關</span>
          <span class="level-count">10 個單字</span>
        `;
        grid.appendChild(btn);
      }
    }

    function startLevel(levelIndex) {
      currentLevel = levelIndex;
      currentQuestionIndex = 0;
      const start = levelIndex * 10;
      levelWords = wordBank.slice(start, start + 10);
      
      if (levelWords.length === 0) return alert("該關卡暫無單字！");

      switchView('view-game');
      loadQuestion();
    }

    function loadQuestion() {
      const currentWord = levelWords[currentQuestionIndex];
      document.getElementById('game-progress').innerText = `進度：${currentQuestionIndex + 1} / ${levelWords.length}`;
      document.getElementById('target-word').innerText = currentWord.word;

      const optionsContainer = document.getElementById('options-container');
      optionsContainer.innerHTML = "";

      let options = [currentWord.chinese];
      while (options.length < 3 && options.length < wordBank.length) {
        const randomWord = wordBank[Math.floor(Math.random() * wordBank.length)].chinese;
        if (!options.includes(randomWord)) options.push(randomWord);
      }
      options.sort(() => Math.random() - 0.5);

      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = "option-btn";
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(opt === currentWord.chinese, btn);
        optionsContainer.appendChild(btn);
      });
    }

    function checkAnswer(isCorrect, btnElement) {
      if (isCorrect) {
        btnElement.classList.add('correct');
        addCoins(10);

        setTimeout(() => {
          currentQuestionIndex++;
          if (currentQuestionIndex < levelWords.length) {
            loadQuestion();
          } else {
            alert(`🎉 恭喜通關！獲得金幣獎勵！`);
            backToLevels();
          }
        }, 600);
      } else {
        btnElement.classList.add('wrong');
        setTimeout(() => btnElement.classList.remove('wrong'), 500);
      }
    }

    function backToLevels() { switchView('view-levels'); }

    function saveToLeaderboard() {
      try {
        let board = JSON.parse(localStorage.getItem('daily_leaderboard')) || {};
        board[currentUser] = userCoins;
        localStorage.setItem('daily_leaderboard', JSON.stringify(board));
      } catch (e) {}
    }

    function showLeaderboard() {
      switchView('view-leaderboard');
      let board = {};
      try {
        board = JSON.parse(localStorage.getItem('daily_leaderboard')) || {};
      } catch (e) {}
      const sorted = Object.entries(board).sort((a, b) => b[1] - a[1]);

      const list = document.getElementById('leaderboard-list');
      list.innerHTML = sorted.length === 0 ? `<p style="text-align: center; color: #64748b; padding: 16px;">今天還沒有玩家上榜喔！</p>` : "";

      sorted.forEach(([name, coins], index) => {
        const item = document.createElement('div');
        item.className = "leaderboard-item";
        const rankClass = index === 0 ? "rank-1" : index === 1 ? "rank-2" : index === 2 ? "rank-3" : "";
        item.innerHTML = `
          <div>
            <span class="rank-num ${rankClass}">#${index + 1}</span>
            <span style="font-weight: bold;">${name}</span>
          </div>
          <div style="color: #fde047; font-weight: bold;">
            🪙 ${coins}
          </div>
        `;
        list.appendChild(item);
      });
    }
  </script>
</body>
</html>
